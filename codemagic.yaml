workflows:
  stopwatch_ios:
    name: Stopwatch iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.example.laptimer
    scripts:
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project StopwatchIOS.xcodeproj \
            -scheme LapTimer
      - name: Build unsigned archive
        script: |
          xcodebuild archive \
            -project StopwatchIOS.xcodeproj \
            -scheme LapTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/StopwatchIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID
      - name: Package unsigned IPA for LiveContainer
        script: |
          rm -rf build/Payload build/StopwatchIOS.ipa
          mkdir -p build/Payload
          cp -R build/StopwatchIOS.xcarchive/Products/Applications/LapTimer.app build/Payload/LapTimer.app
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload StopwatchIOS.ipa
    artifacts:
      - build/StopwatchIOS.xcarchive
      - build/StopwatchIOS.ipa





