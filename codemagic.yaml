workflows:
  stopwatch_ios:
    name: Stopwatch iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.example.laptimer
    scripts:
      - name: 验证地址编码与私钥转换
        script: |
          set -euo pipefail
          mkdir -p build
          for optimization in -Onone -O; do
            xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library "$optimization" \
              -target "$(uname -m)-apple-macosx14.0" \
              Sources/TronSigner.swift Tests/TronSignerRuntimeTests.swift \
              -o build/TronSignerRuntimeTests
            build/TronSignerRuntimeTests
          done
      - name: 验证 TRX 查询解析
        script: |
          set -euo pipefail
          mkdir -p build
          xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library -O \
            -target "$(uname -m)-apple-macosx14.0" \
            Sources/StopwatchModels.swift Sources/StopwatchEngine.swift Sources/TronSigner.swift \
            Tests/TronQueryRuntimeTests.swift -o build/TronQueryRuntimeTests
          build/TronQueryRuntimeTests
      - name: 验证查询持久化
        script: |
          set -euo pipefail
          mkdir -p build
          xcrun --sdk macosx swiftc -swift-version 5 -parse-as-library -O \
            -target "$(uname -m)-apple-macosx14.0" \
            Sources/StopwatchModels.swift Sources/StopwatchState.swift \
            Sources/StopwatchEngine.swift Sources/TronSigner.swift \
            Tests/TronManagerStateTests.swift -o build/TronManagerStateTests
          build/TronManagerStateTests
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project StopwatchIOS.xcodeproj \
            -scheme LapTimer
      - name: Build unsigned archive
        script: |
          xcodebuild archive \
            -project StopwatchIOS.xcodeproj \
            -scheme LapTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/StopwatchIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID
      - name: Package unsigned IPA for LiveContainer
        script: |
          rm -rf build/Payload build/StopwatchIOS.ipa
          mkdir -p build/Payload
          APP_PATH=build/StopwatchIOS.xcarchive/Products/Applications/LapTimer.app
          test -x "$APP_PATH/LapTimer"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist"
          cp -R "$APP_PATH" build/Payload/LapTimer.app
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload StopwatchIOS.ipa
    artifacts:
      - build/StopwatchIOS.xcarchive
      - build/StopwatchIOS.ipa





