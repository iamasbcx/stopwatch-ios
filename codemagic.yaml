workflows:
  stopwatch_ios:
    name: Stopwatch iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.example.laptimer
    scripts:
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project StopwatchIOS.xcodeproj \
            -scheme LapTimer
      - name: Build unsigned archive
        script: |
          xcodebuild archive \
            -project StopwatchIOS.xcodeproj \
            -scheme LapTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/StopwatchIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID
    artifacts:
      - build/StopwatchIOS.xcarchive





